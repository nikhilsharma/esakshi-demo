<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Vendor(s) for Work</title>
    <link rel="stylesheet" href="../../internalPages.css">
    <script>
        let images = ['1-Login.png', '2-My-Modules.png', '3-Manage-Work-After-due-sanction-of-IDA.png', 
        '4-Select-Work-via-IA-Main-Login.png', '5-Checkbox-of-Vendor-Identification.png', '6-1-Select-Vendor.png',
        '6-Select-Vendor.png', 
        '7-Click-OK-Add-Vendors.png', '7-Click-Submit.png', '8-Confirm-Vendors.png',
        '9-Status-of-Work-Changes.png'
        ];

        let currentIndex = 0;

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }
    </script>
</head>
<body>

<div class="container">
    <!-- Image Container -->
    <div class="image-container">
        <img id="mainImage" src="1-Login.png" alt="Workflow Image">
    </div>

    <!-- Button Container -->
    <div class="button-container">
        <!-- Previous Button -->
        <button class="overlay-button" onclick="prevImage()">Previous Step</button>

        <!-- Home Button (Centered) -->
        <a href="#">
            <button class="home-button" onclick="history.back()">Back to Main Page</button>
        </a>

        <!-- Next Button -->
        <button class="overlay-button" onclick="nextImage()">Next Step</button>
    </div>
</div>

</body>
</html>
