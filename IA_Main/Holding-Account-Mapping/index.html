<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA / IDA Work Approval Process</title>
    <link rel="stylesheet" href="../../internalPages.css">
    <script>
        let images = ['holding mapping.jpg','1_Login.png', '2_Master Configuration.png', '3_Holding Account Mapping.png', '3_Add_Button.png', '4_Enter Details.png'];
        let currentIndex = 0;

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }
    </script>
</head>
<body>

<div class="container">
    <!-- Image Container -->
    <div class="image-container">
        <img id="mainImage" src="holding mapping.jpg" alt="Workflow Image">
    </div>

    <!-- Button Container -->
    <div class="button-container">
        <!-- Previous Button -->
        <button class="overlay-button" onclick="prevImage()">Previous Step</button>

        <!-- Home Button (Centered) -->
        <a href="#">
            <button class="home-button" onclick="history.back()">Back to Main Page</button>
        </a>

        <!-- Next Button -->
        <button class="overlay-button" onclick="nextImage()">Next Step</button>
    </div>
</div>

</body>
</html>
