<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Work For Feasibility To IA</title>
    <link rel="stylesheet" href="../../internalPages.css">
    <script>
        let images = ['1-Login.png', '2-My-Modules.png', '3-Manage-Vendor-Pending-with-PFMS.png', 
        '4-Add-Vendor.png', '5-Fill-Fields.png', '6-Click-Add.png',
        '6-Click-Save.png', 
        '7-Vendor-Registered-Successfully.png', '8-See-Status-of-Vendor-Validation.png', '9-See-Validated-Vendors.png',
        '10-Select-Fields.png', '11-See-Search-Validated-Vendors.png'
        ];

        let currentIndex = 0;

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }
    </script>
</head>
<body>

<div class="container">
    <!-- Image Container -->
    <div class="image-container">
        <img id="mainImage" src="1-Login.png" alt="Workflow Image">
    </div>

    <!-- Button Container -->
    <div class="button-container">
        <!-- Previous Button -->
        <button class="overlay-button" onclick="prevImage()">Previous Step</button>

        <!-- Home Button (Centered) -->
        <a href="#">
            <button class="home-button" onclick="history.back()">Back to Main Page</button>
        </a>

        <!-- Next Button -->
        <button class="overlay-button" onclick="nextImage()">Next Step</button>
    </div>
</div>

</body>
</html>
