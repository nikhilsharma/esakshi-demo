<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Time Estimate</title>
    <link rel="stylesheet" href="../../internalPages.css">
    <script>
        let images = ['1-Login-via-IA-Checker.png', '20-Login-Via-IA-Checker.png', '21-Select-Work.png', '22-Forward-Option-Appears.png', 
        '23-Select-Declaration-and-recommendation.png', '24-Click-Forward.png', '25-Click-Send-Note-Details.png',
        '26-Forwarding-Message-Appears.png', 
        '27-See-Status-In-Inbox.png', '28-See-Status-In-Outbox.png', '29-See-Currently-With.png'
        ];

        let currentIndex = 0;

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }
    </script>
</head>
<body>

<div class="container">
    <!-- Image Container -->
    <div class="image-container">
        <img id="mainImage" src="1-Login-via-IA-Checker.png" alt="Workflow Image">
    </div>

    <!-- Button Container -->
    <div class="button-container">
        <!-- Previous Button -->
        <button class="overlay-button" onclick="prevImage()">Previous Step</button>

        <!-- Home Button (Centered) -->
        <a href="#">
            <button class="home-button" onclick="history.back()">Back to Main Page</button>
        </a>

        <!-- Next Button -->
        <button class="overlay-button" onclick="nextImage()">Next Step</button>
    </div>
</div>

</body>
</html>
