<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pullback From IA</title>
    <link rel="stylesheet" href="../../internalPages.css">
    <script>
        let images = ['pullback-from-IA.jpg', '1-Login.png', '2-My-Modules.png', '3-Development-Work.png', 
        '4-Work-Management.png', '5-Manage-IA-Pullback.png', '6-Select-Approved-Work.png', '7-Select-Action.png', 
        '8-Click-Submit.png', '9-Confirm-Pullback.png', '10-Work-Shown-Under-MP-Recommendations.png', '11-Select-Work.png', 
        '12-Can-Send-Work-Back-To-Any-IA.png'];

        let currentIndex = 0;

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }
    </script>
</head>
<body>

<div class="container">
    <!-- Image Container -->
    <div class="image-container">
        <img id="mainImage" src="pullback-from-IA.jpg" alt="Workflow Image">
    </div>

    <!-- Button Container -->
    <div class="button-container">
        <!-- Previous Button -->
        <button class="overlay-button" onclick="prevImage()">Previous Step</button>

        <!-- Home Button (Centered) -->
        <a href="#">
            <button class="home-button" onclick="history.back()">Back to Main Page</button>
        </a>

        <!-- Next Button -->
        <button class="overlay-button" onclick="nextImage()">Next Step</button>
    </div>
</div>

</body>
</html>
