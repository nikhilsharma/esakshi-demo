<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanction Work To IA</title>
    <link rel="stylesheet" href="../../internalPages.css">
    <script>
        let images = ['sanction_work_IA.jpg', '1-Login.png', '2-My-Modules.png', '3-Development-Work.png', 
        '4-Work-Management.png', '5-Manage-MP-Work-Recommendation.png', '6-View-MP-Work-Recommendation.png',
         '7-Approve-Reject-Work.png', '8-Upload-Sanctions.png', '9-Click-Submit.png', '10-Work-Status-Approved.png'];

        let currentIndex = 0;

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('mainImage').src = images[currentIndex];
        }
    </script>
</head>
<body>

<div class="container">
    <!-- Image Container -->
    <div class="image-container">
        <img id="mainImage" src="sanction_work_IA.jpg" alt="Workflow Image">
    </div>

    <!-- Button Container -->
    <div class="button-container">
        <!-- Previous Button -->
        <button class="overlay-button" onclick="prevImage()">Previous Step</button>

        <!-- Home Button (Centered) -->
        <a href="#">
            <button class="home-button" onclick="history.back()">Back to Main Page</button>
        </a>

        <!-- Next Button -->
        <button class="overlay-button" onclick="nextImage()">Next Step</button>
    </div>
</div>

</body>
</html>
